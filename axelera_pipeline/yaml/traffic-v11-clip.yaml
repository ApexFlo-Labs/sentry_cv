axelera-model-format: 1.0.0

name: traffic-v11-clip

description: our traffic-v11 YOLO26n detector (9 classes), 640x640, NMS free; vehicle_yolo26n.onnx md5 7f71d937, same weights as the DL Streamer vehicle_v11_static

pipeline:
  - detections:
      model_name: traffic-v11-clip
      input:
        type: image
      preprocess:
        - letterbox:
            height: ${{input_height}}
            scaleup: true
            width: ${{input_width}}
        - torch-totensor:
      inference:
        handle_all: false
      postprocess:
        - decodeyolo10:
            box_format: xyxy
            conf_threshold: 0.3   # same threshold as the DL Streamer pipeline
            dfl_size: 1
            label_filter: ${{label_filter}}
            normalized_coord: false
            top_k: 300
            use_multi_label: false
            eval:
              conf_threshold: 0.001
              use_multi_label: true

models:
  traffic-v11-clip:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: /home/admin1/chandana_axelera/models/weights/vehicle_yolo26n_clip8.onnx
    task_category: ObjectDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 640, 640]
    input_color_format: RGB
    num_classes: 9
    dataset: traffic-v11-cameras
    extra_kwargs:
      compiler_config_file: yolo26.toml

datasets:
  traffic-v11-cameras:
    class: ObjDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py
    data_dir_name: traffic_v11
    label_type: YOLOv8
    labels_path: /home/admin1/chandana_axelera/calib/traffic_v11.names
    repr_imgs_dir_name: repr_imgs
    val_data: NO_LABELS_val_not_available   # no labelled set yet; only here because SDK 1.6 requires the key
    repr_imgs_dataloader_color_format: RGB

operators:
  decodeyolo10:
    class: DecodeYolo10
    class_path: /home/admin1/chandana_axelera/ax_models/ours/decoders/yolo10_ours.py
